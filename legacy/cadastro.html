<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — TironiDraws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <main class="auth">
    <div class="auth__box">

      <div class="auth__head">
        <div class="auth__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/></svg>
        </div>
        <h1>Crie sua conta</h1>
        <p>Cadastre-se para começar</p>
      </div>

      <div class="auth__card">
        <button type="button" class="btn btn--outline btn--block" id="googleBtn">
          <svg viewBox="0 0 24 24" class="google-icon"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.49 12c0-.73.13-1.44.35-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.16-3.16A10.97 10.97 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continuar com Google
        </button>

        <div class="divider"><span>ou</span></div>

        <div class="auth__error" id="authError" hidden>As senhas não coincidem</div>

        <form id="registerForm">
          <div class="field">
            <label for="email">E-mail</label>
            <div class="field__input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" autofocus required />
            </div>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="field__input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
            </div>
          </div>

          <div class="field">
            <label for="confirm">Confirmar senha</label>
            <div class="field__input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password" required />
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="registerBtn">Criar conta</button>
        </form>
      </div>

      <p class="auth__footer">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>

      <p class="auth__back">
        <a href="index.html">← Voltar para o site</a>
      </p>

    </div>
  </main>

  <script>
    // Cadastro visual (sem backend): valida senhas iguais e vai ao dashboard
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const errorBox = document.getElementById("authError");

      if (password !== confirm) {
        errorBox.hidden = false;
        return;
      }
      errorBox.hidden = true;

      const btn = document.getElementById("registerBtn");
      btn.disabled = true;
      btn.textContent = "Criando conta...";
      setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
    });

    document.getElementById("googleBtn").addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
